<style>
/* ─────────────────────────────────────────────
   LA CATEDRAL — piedra, tinta y rúbrica
   ───────────────────────────────────────────── */
:root{
  --piedra:#EAE9E6;
  --piedra-clara:#F5F4F2;
  --tinta:#16140F;
  --tinta-suave:#6B6862;
  --rubro:#A3212B;
  --linea:#D2D0CB;

  --serif:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  --gut:clamp(18px,5vw,40px);
  --maxw:760px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

body{background:var(--piedra);color:var(--tinta);
  font-family:var(--serif);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}

.rubro{font-family:var(--sans);font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--rubro)}

.orn{display:block;width:100%;max-width:280px;margin:0 auto}
.orn i{display:block;background:var(--tinta)}
.orn i:first-child{height:2px}
.orn i:last-child{height:1px;margin-top:3px;opacity:.55}

/* ═══ BARRA ═══ */
header{position:sticky;top:0;z-index:50;
  background:rgba(234,233,230,.94);
  backdrop-filter:saturate(150%) blur(10px);
  -webkit-backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--linea)}
.bar{display:flex;align-items:center;gap:14px;height:52px;
  max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
.mark{font-family:var(--serif);font-weight:700;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  text-decoration:none;color:var(--tinta);display:flex;align-items:center;gap:7px}
.mark::before{content:"";width:9px;height:9px;background:var(--rubro);
  clip-path:polygon(38% 0,62% 0,62% 38%,100% 38%,100% 62%,62% 62%,62% 100%,38% 100%,38% 62%,0 62%,0 38%,38% 38%)}
nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font-family:var(--sans);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--tinta-suave);
  padding:7px 10px;border-radius:2px;white-space:nowrap;
  transition:color .18s ease,background .18s ease}
nav a:hover,nav a:focus-visible{color:var(--tinta);background:rgba(0,0,0,.05)}
nav a[aria-current="true"]{color:var(--rubro)}

/* ═══ PORTADA ═══ */
.hero{position:relative;isolation:isolate;text-align:center;
  padding:clamp(38px,9vw,76px) 0 clamp(30px,7vw,54px)}

/* Fondo fotográfico: monocromo sobre piedra, así cualquier foto entra en paleta */
.hero-foto{position:absolute;inset:0;z-index:-1;overflow:hidden;
  background:var(--piedra)}
.hero-foto img{width:100%;height:100%;object-fit:cover;display:block;
  mix-blend-mode:multiply;opacity:.58;
  transform:scale(1.06);
  animation:asentar 1.6s cubic-bezier(.16,1,.3,1) forwards}
@keyframes asentar{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hero-foto img{animation:none;transform:none}}
/* La piedra se cierra arriba y abajo para que el logo y la barra respiren */
.hero-foto::after{content:"";position:absolute;inset:0;
  background:
    /* Halo: despeja la piedra justo donde se apoya el logo */
    radial-gradient(ellipse 46% 42% at 50% 40%,
      rgba(234,233,230,.82) 0%,
      rgba(234,233,230,.55) 45%,
      rgba(234,233,230,0) 78%),
    /* Cierre por arriba y por abajo, para la barra y el texto */
    linear-gradient(to bottom,
      var(--piedra) 0%,
      rgba(234,233,230,.30) 20%,
      rgba(234,233,230,.22) 52%,
      rgba(234,233,230,.72) 80%,
      var(--piedra) 100%)}

.hero img.logo{width:min(74vw,282px);height:auto;display:block;
  margin:0 auto clamp(20px,5vw,30px);position:relative}
.hero.con-foto{padding-top:clamp(54px,12vw,96px);padding-bottom:clamp(44px,10vw,74px)}

.hero .slogan{font-style:italic;font-size:clamp(16px,4.2vw,20px);
  color:var(--tinta-suave);margin:18px 0}
.estado{display:inline-flex;align-items:center;gap:8px;margin-top:6px;
  font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.punto{width:7px;height:7px;border-radius:50%;background:var(--tinta-suave);flex:none}
.estado.abierto .punto{background:#1E7A44}
.estado.abierto b{color:#1E7A44}
.estado.cerrado .punto{background:var(--rubro)}
.estado.cerrado b{color:var(--rubro)}
.estado span{color:var(--tinta-suave)}

.acciones{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:26px}
.btn{font-family:var(--sans);font-size:13px;letter-spacing:.05em;
  text-decoration:none;padding:12px 20px;border:1px solid var(--tinta);
  color:var(--tinta);background:transparent;min-height:44px;
  display:inline-flex;align-items:center;
  transition:background .18s ease,color .18s ease}
.btn:hover,.btn:focus-visible{background:var(--tinta);color:var(--piedra)}
.btn.solid{background:var(--tinta);color:var(--piedra)}
.btn.solid:hover,.btn.solid:focus-visible{background:var(--rubro);border-color:var(--rubro)}

/* ═══ SECCIONES ═══ */
section{padding:clamp(34px,8vw,62px) 0}
.tit{text-align:center;margin-bottom:clamp(24px,6vw,38px)}
.tit h2{font-size:clamp(25px,6.5vw,36px);font-weight:700;
  letter-spacing:-.01em;line-height:1.12;margin:9px 0 12px}

/* ═══ CARTA ═══ */
.banda{background:var(--tinta);color:var(--piedra-clara);
  font-family:var(--sans);font-size:12px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;text-align:center;
  padding:8px 12px;margin:34px 0 4px}
.banda.sub{background:#5A5751;font-size:11px;letter-spacing:.13em;
  padding:6px 12px;margin-top:16px}
.grupo>.banda:first-child{margin-top:0}

.item{display:grid;grid-template-columns:1fr auto;gap:6px 16px;
  align-items:baseline;padding:10px 0 9px;border-bottom:1px solid var(--linea)}
.item h3{font-size:17px;font-weight:400;line-height:1.3}
.item .precio{font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;font-size:17px}
.item .consultar{font-style:italic;font-weight:400;font-size:14px;color:var(--tinta-suave)}
.item p{grid-column:1/-1;font-style:italic;font-size:14.5px;
  line-height:1.42;color:var(--tinta-suave);margin-top:-2px}

.nota-carta{margin-top:30px;padding-top:20px;border-top:1px solid var(--linea);
  text-align:center;font-style:italic;font-size:14px;color:var(--tinta-suave)}
.taza{width:132px;height:auto;display:block;margin:30px auto 4px;
  /* Tinta impresa sobre la piedra: sin fondo, sin recuadro */}

/* ── Índice de secciones ── */
.indice{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
  margin-bottom:clamp(26px,6vw,40px)}
.indice button{font-family:var(--sans);font-size:12px;letter-spacing:.07em;
  text-transform:uppercase;padding:9px 14px;min-height:40px;
  border:1px solid var(--linea);background:var(--piedra-clara);
  color:var(--tinta-suave);cursor:pointer;
  transition:border-color .18s ease,color .18s ease,background .18s ease}
.indice button:hover{color:var(--tinta);border-color:var(--tinta-suave)}
.indice button[aria-pressed="true"]{background:var(--tinta);color:var(--piedra-clara);
  border-color:var(--tinta)}

/* ── Pase de página: al final de cada sección ── */
.pase{margin-top:40px;padding-top:26px;border-top:2px solid var(--tinta)}
.pase-tit{text-align:center;display:block;margin-bottom:16px}
.pase-par{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:520px){.pase-par{grid-template-columns:1fr}}
.pase-par button{font-family:var(--serif);text-align:left;cursor:pointer;
  background:var(--piedra-clara);border:1px solid var(--linea);
  padding:14px 16px;min-height:64px;color:var(--tinta);width:100%;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  transition:border-color .18s ease,background .18s ease,transform .18s ease}
.pase-par button:hover{border-color:var(--tinta);background:var(--blanco,#fff)}
.pase-par button:active{transform:translateY(1px)}
.pase-par .dir{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rubro)}
.pase-par .nom{font-size:16.5px;line-height:1.25}
.pase-par .sig{text-align:right;align-items:flex-end}
.pase-todas{display:block;margin:16px auto 0;background:transparent;border:0;
  font-family:var(--sans);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-suave);cursor:pointer;padding:12px 16px;min-height:44px;
  border-bottom:1px solid var(--linea);transition:color .18s ease,border-color .18s ease}
.pase-todas:hover{color:var(--rubro);border-color:var(--rubro)}

/* ═══ EL LUGAR ═══ */
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:10px;margin:30px 0}
.foto{aspect-ratio:4/5;background:var(--piedra-clara);
  border:1px solid var(--linea);overflow:hidden;position:relative}
.foto img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s cubic-bezier(.22,1,.36,1)}
.foto:hover img{transform:scale(1.03)}
.foto.vacia::after{content:attr(data-lbl);position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#A9A6A0}
.prosa{font-size:17.5px;line-height:1.62;text-align:center;max-width:56ch;margin:0 auto}

/* ═══ DATOS ═══ */
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:26px 30px;margin-top:34px;text-align:left}
.dato .rubro{display:block;margin-bottom:9px}
.dato p,.dato a{font-size:16px;line-height:1.5}
.dato a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--linea)}
.dato a:hover,.dato a:focus-visible{border-color:var(--rubro);color:var(--rubro)}
.horario{display:flex;justify-content:space-between;gap:14px;
  padding:5px 0;border-bottom:1px solid var(--linea);font-size:15.5px}
.horario:last-child{border-bottom:0}
.horario b{font-weight:400;color:var(--tinta-suave)}
.horario span{font-variant-numeric:tabular-nums;white-space:nowrap}

footer{border-top:1px solid var(--linea);padding:30px 0 40px;text-align:center}
footer p{font-size:13.5px;color:var(--tinta-suave)}
footer .orn{margin-bottom:20px}

.cargando{text-align:center;padding:60px 0;color:var(--tinta-suave);font-style:italic}
.fallo{text-align:center;padding:40px 0;color:var(--rubro)}

.rev{opacity:0;transform:translateY(12px)}
.rev.on{opacity:1;transform:none;
  transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){.rev{opacity:1;transform:none}}


/* ── Visor de fotos ── */
.foto.ampliable{cursor:zoom-in}
.foto.ampliable::before{content:"";position:absolute;inset:0;z-index:1;
  background:rgba(22,20,15,0);transition:background .25s ease}
.foto.ampliable:hover::before,.foto.ampliable:focus-visible::before{background:rgba(22,20,15,.14)}
.foto.ampliable::after{content:"⤢";position:absolute;right:9px;bottom:8px;z-index:2;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:rgba(234,233,230,.92);color:var(--tinta);font-size:13px;
  opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .25s ease}
.foto.ampliable:hover::after,.foto.ampliable:focus-visible::after{opacity:1;transform:none}
@media (hover:none){.foto.ampliable::after{opacity:1;transform:none}}

.visor{position:fixed;inset:0;z-index:100;
  background:rgba(22,20,15,.93);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(14px,4vw,44px);
  opacity:0;pointer-events:none;transition:opacity .28s ease}
.visor.on{opacity:1;pointer-events:auto}
.visor figure{max-width:100%;max-height:100%;display:flex;
  flex-direction:column;align-items:center;gap:14px;
  transform:scale(.96);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.visor.on figure{transform:none}
.visor img{max-width:100%;max-height:76vh;width:auto;height:auto;
  object-fit:contain;display:block}
.visor figcaption{font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;
  color:rgba(234,233,230,.7);text-align:center;max-width:44ch}
.visor .cerrar{position:absolute;top:14px;right:14px;
  width:44px;height:44px;border:0;cursor:pointer;
  background:transparent;color:var(--piedra);font-size:26px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s ease}
.visor .cerrar:hover{color:var(--rubro)}
.visor .flecha{position:absolute;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border:0;cursor:pointer;
  background:transparent;color:var(--piedra);font-size:30px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s ease}
.visor .flecha:hover{color:var(--rubro)}
.visor .ant{left:4px}
.visor .sig{right:4px}
@media (max-width:520px){.visor .flecha{width:44px;font-size:24px}}
@media (prefers-reduced-motion:reduce){.visor figure{transform:none}}

:focus-visible{outline:2px solid var(--rubro);outline-offset:3px}

@media print{
  header,.indice,.acciones,.galeria,footer,.estado,.pase,.hero-foto{display:none!important}
  body{background:#fff;font-size:11pt}
  .rev{opacity:1;transform:none}
  section{padding:0;page-break-inside:avoid}
  .banda{background:#000!important;color:#fff!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<body>

<header>
  <div class="bar">
    <a class="mark" href="#inicio">La Catedral</a>
    <nav>
      <a href="#carta">Carta</a>
      <a href="#lugar">El lugar</a>
      <a href="#visitanos">Visítanos</a>
    </nav>
  </div>
</header>

<main>

<div class="hero" id="inicio">
  <div class="hero-foto" id="hero-foto" hidden></div>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="La Catedral, bar restaurante" width="282" height="274" fetchpriority="high">
    <div class="orn"><i></i><i></i></div>
    <p class="slogan" id="slogan">…para rendir culto a la buena mesa…</p>
    <div class="orn"><i></i><i></i></div>
    <div id="estado"></div>
    <div class="acciones">
      <a class="btn solid" href="#carta">Ver la carta</a>
      <a class="btn" href="#visitanos">Cómo llegar</a>
    </div>
  </div>
</div>

<section id="carta">
  <div class="wrap">
    <div class="tit">
      <span class="rubro">La carta</span>
      <h2>Lo que servimos hoy</h2>
      <p class="rubro" id="sello" style="color:var(--tinta-suave);font-weight:400"></p>
    </div>
    <div class="indice" id="indice" role="group" aria-label="Secciones de la carta"></div>
    <div id="menu"><p class="cargando">Cargando la carta…</p></div>
  </div>
</section>

<section id="lugar">
  <div class="wrap">
    <div class="tit">
      <span class="rubro">El lugar</span>
      <h2>Salón y terraza</h2>
    </div>
    <p class="prosa rev" id="descripcion"></p>
    <div class="galeria rev" id="galeria"></div>
  </div>
</section>

<section id="visitanos">
  <div class="wrap">
    <div class="tit">
      <span class="rubro">Visítanos</span>
      <h2>Dónde y cuándo</h2>
    </div>
    <div class="datos rev" id="datos"></div>
  </div>
</section>

</main>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button class="cerrar" id="v-cerrar" aria-label="Cerrar">×</button>
  <button class="flecha ant" id="v-ant" aria-label="Foto anterior">‹</button>
  <button class="flecha sig" id="v-sig" aria-label="Foto siguiente">›</button>
  <figure>
    <img id="v-img" src="" alt="">
    <figcaption id="v-txt"></figcaption>
  </figure>
</div>

<footer>
  <div class="wrap">
    <div class="orn"><i></i><i></i></div>
    <p><strong>La Catedral</strong> · Bar Restaurante</p>
    <p id="pie-dir"></p>
  </div>
</footer>

<script>
(function(){
"use strict";

var CACHE = "catedral.carta.v2";
var $ = function(s){ return document.querySelector(s); };

/* Precio con coma de millares: idéntico a la carta impresa */
function precio(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function estadoAhora(horario){
  if(!horario || !horario.length) return null;
  var d = new Date(), dow = d.getDay();
  var min = d.getHours()*60 + d.getMinutes();
  var idx = dow===0 ? 2 : (dow>=5 ? 1 : 0);
  var h = horario[Math.min(idx, horario.length-1)];
  if(!h) return null;
  function mins(t){ var p = String(t).split(":"); return (+p[0])*60 + (+p[1]||0); }
  var a = mins(h.abre), c = mins(h.cierra);
  var abierto = c > a ? (min >= a && min < c) : (min >= a || min < c);
  return { abierto: abierto, cierra: h.cierra, abre: h.abre };
}

function pintarEstado(local){
  var e = estadoAhora(local.horario), box = $("#estado");
  if(!e){ box.innerHTML = ""; return; }
  box.innerHTML =
    '<p class="estado ' + (e.abierto ? "abierto" : "cerrado") + '">' +
      '<i class="punto"></i>' +
      '<b>' + (e.abierto ? "Abierto ahora" : "Cerrado ahora") + '</b>' +
      '<span>' + (e.abierto ? "hasta las " + e.cierra : "abrimos a las " + e.abre) + '</span>' +
    '</p>';
}

/* ═══ CARTA ═══ */
var SECS = [];

function pintarMenu(data){
  SECS = data.secciones || [];
  var idx = "", html = "";

  SECS.forEach(function(sec, i){
    var id = "sec-" + (sec.id || i);
    idx += '<button type="button" data-t="' + i + '" aria-pressed="' + (i===0) + '">' +
             esc(sec.titulo_tematico) + '</button>';

    html += '<div class="grupo rev" id="' + id + '" data-i="' + i + '"' +
            (i===0 ? "" : ' hidden') + '>';

    var yaCoctel = false;
    (sec.subsecciones || []).forEach(function(sub){
      if(sub.grupo === "cocteles" && !yaCoctel){
        html += '<div class="banda">Cocteles</div>';
        yaCoctel = true;
      }
      html += '<div class="banda' + (sub.grupo === "cocteles" ? " sub" : "") + '">' +
              esc(sub.nombre) + '</div>';

      (sub.items || []).forEach(function(it){
        html += '<article class="item">' +
                  '<h3>' + esc(it.nombre) + '</h3>' +
                  (it.precio == null
                    ? '<span class="precio consultar">consultar</span>'
                    : '<span class="precio">' + precio(it.precio) + '</span>') +
                  (it.descripcion ? '<p>' + esc(it.descripcion) + '</p>' : '') +
                '</article>';
      });
    });

    if(sec.id === "postres")
      html += '<img class="taza" src="taza-tinta.png" alt="" loading="lazy" width="132" height="138">';
    if(sec.pie) html += '<p class="nota-carta">' + esc(sec.pie) + '</p>';

    /* Pase de página: la sección anterior y la siguiente, al alcance */
    var ant = SECS[i-1], sig = SECS[i+1];
    html += '<div class="pase">' +
              '<span class="rubro pase-tit">Sigue la carta</span>' +
              '<div class="pase-par">' +
                (ant ? '<button type="button" data-ir="'+(i-1)+'">' +
                         '<span class="dir">← Anterior</span>' +
                         '<span class="nom">'+esc(ant.titulo_tematico)+'</span></button>'
                     : '<span></span>') +
                (sig ? '<button type="button" class="sig" data-ir="'+(i+1)+'">' +
                         '<span class="dir">Siguiente →</span>' +
                         '<span class="nom">'+esc(sig.titulo_tematico)+'</span></button>'
                     : '<span></span>') +
              '</div>' +
              '<button type="button" class="pase-todas" data-todas="1">Todas las secciones</button>' +
            '</div>';

    html += '</div>';
  });

  $("#indice").innerHTML = idx;
  $("#menu").innerHTML   = html;

  $("#indice").addEventListener("click", function(ev){
    var b = ev.target.closest("button");
    if(b) irA(+b.dataset.t, false);
  });

  $("#menu").addEventListener("click", function(ev){
    var b = ev.target.closest("button");
    if(!b) return;
    if(b.dataset.ir !== undefined) irA(+b.dataset.ir, true);
    if(b.dataset.todas) subirAlIndice();
  });

  document.querySelectorAll("#menu .grupo").forEach(observar);
}

function irA(i, subir){
  document.querySelectorAll("#indice button").forEach(function(x,k){
    x.setAttribute("aria-pressed", String(k === i));
  });
  document.querySelectorAll("#menu .grupo").forEach(function(g){
    g.hidden = (+g.dataset.i !== i);
  });
  var g = document.querySelector('#menu .grupo[data-i="'+i+'"]');
  if(g){ g.classList.add("on"); }
  if(subir) subirAlIndice();
}

function subirAlIndice(){
  var y = $("#carta").getBoundingClientRect().top + window.scrollY - 60;
  window.scrollTo({ top:y, behavior:"smooth" });
}

/* ═══ IDENTIDAD ═══ */
function pintarLocal(local, sello){
  if(local.slogan) $("#slogan").textContent = local.slogan;
  $("#descripcion").textContent = local.descripcion || "";
  $("#pie-dir").textContent = local.direccion || "";
  if(sello) $("#sello").textContent =
    "Precios en " + (local.moneda || "CUP") + " · actualizada el " + sello;

  pintarEstado(local);

  /* Foto de portada */
  if(local.portada){
    var hf = $("#hero-foto");
    hf.innerHTML = '<img src="'+esc(local.portada)+'" alt="" fetchpriority="high">';
    hf.hidden = false;
    $(".hero").classList.add("con-foto");
  }

  /* Galería */
  FOTOS = (local.galeria || []).filter(function(f){ return f.img; });
  $("#galeria").innerHTML = (local.galeria || []).map(function(f){
    if(!f.img) return '<div class="foto vacia" data-lbl="'+esc(f.alt||"Foto")+'"></div>';
    var i = FOTOS.indexOf(f);
    return '<div class="foto ampliable" role="button" tabindex="0" data-foto="'+i+'" ' +
           'aria-label="Ampliar: '+esc(f.alt||"foto")+'">' +
           '<img src="'+esc(f.img)+'" alt="'+esc(f.alt||"")+'" loading="lazy"></div>';
  }).join("");

  var h = (local.horario || []).map(function(x){
    return '<div class="horario"><b>' + esc(x.dias) + '</b>' +
           '<span>' + esc(x.abre) + " – " + esc(x.cierra) + '</span></div>';
  }).join("");

  var contacto = "";
  if(local.telefono)  contacto += '<p><a href="tel:'+esc(local.telefono.replace(/\s/g,""))+'">'+esc(local.telefono)+'</a></p>';
  if(local.whatsapp)  contacto += '<p><a href="https://wa.me/'+esc(local.whatsapp.replace(/\D/g,""))+'">WhatsApp</a></p>';
  if(local.instagram) contacto += '<p><a href="https://instagram.com/'+esc(local.instagram.replace("@",""))+'">'+esc(local.instagram)+'</a></p>';
  if(!contacto) contacto = '<p style="color:var(--tinta-suave)">Añade tu teléfono desde el editor.</p>';

  $("#datos").innerHTML =
    '<div class="dato"><span class="rubro">Dirección</span>' +
      '<p>' + esc(local.direccion || "") + '</p>' +
      (local.mapa ? '<p style="margin-top:9px"><a href="'+esc(local.mapa)+'" target="_blank" rel="noopener">Abrir en el mapa</a></p>' : "") +
    '</div>' +
    '<div class="dato"><span class="rubro">Horario</span>' + h + '</div>' +
    '<div class="dato"><span class="rubro">Contacto</span>' + contacto + '</div>';
}

/* ═══ VISOR DE FOTOS ═══ */
var FOTOS = [], VI = 0, ANTES = null;

function abrirVisor(i){
  if(!FOTOS.length) return;
  VI = (i + FOTOS.length) % FOTOS.length;
  var f = FOTOS[VI];
  var img = $("#v-img");
  img.src = f.grande || f.img;
  img.alt = f.alt || "";
  $("#v-txt").textContent = f.alt || "";
  var uno = FOTOS.length < 2;
  $("#v-ant").hidden = uno;
  $("#v-sig").hidden = uno;
  var v = $("#visor");
  v.hidden = false;
  requestAnimationFrame(function(){ v.classList.add("on"); });
  document.body.style.overflow = "hidden";
  ANTES = document.activeElement;
  $("#v-cerrar").focus();
}

function cerrarVisor(){
  var v = $("#visor");
  v.classList.remove("on");
  document.body.style.overflow = "";
  setTimeout(function(){ v.hidden = true; $("#v-img").src = ""; }, 280);
  if(ANTES && ANTES.focus) ANTES.focus();
}

$("#galeria").addEventListener("click", function(ev){
  var d = ev.target.closest("[data-foto]");
  if(d) abrirVisor(+d.dataset.foto);
});
$("#galeria").addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" && ev.key !== " ") return;
  var d = ev.target.closest("[data-foto]");
  if(d){ ev.preventDefault(); abrirVisor(+d.dataset.foto); }
});

$("#v-cerrar").onclick = cerrarVisor;
$("#v-ant").onclick = function(e){ e.stopPropagation(); abrirVisor(VI-1); };
$("#v-sig").onclick = function(e){ e.stopPropagation(); abrirVisor(VI+1); };
$("#visor").addEventListener("click", function(e){
  if(e.target === this || e.target.tagName === "FIGURE") cerrarVisor();
});

addEventListener("keydown", function(e){
  if($("#visor").hidden) return;
  if(e.key === "Escape")     cerrarVisor();
  if(e.key === "ArrowLeft")  abrirVisor(VI-1);
  if(e.key === "ArrowRight") abrirVisor(VI+1);
});

/* Deslizar en el móvil */
(function(){
  var x0 = null;
  var v = $("#visor");
  v.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  v.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 55) abrirVisor(dx < 0 ? VI+1 : VI-1);
    x0 = null;
  }, {passive:true});
})();

/* ═══ APARICIÓN ═══ */
var io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); }
      });
    }, { rootMargin:"0px 0px -8% 0px", threshold:.05 })
  : null;
function observar(el){ if(io) io.observe(el); else el.classList.add("on"); }

function navActiva(){
  var links = [].slice.call(document.querySelectorAll("nav a"));
  var secs  = links.map(function(a){ return document.querySelector(a.getAttribute("href")); });
  function marcar(){
    var y = window.scrollY + 90, act = -1;
    secs.forEach(function(s,i){ if(s && s.offsetTop <= y) act = i; });
    links.forEach(function(a,i){
      if(i === act) a.setAttribute("aria-current","true");
      else a.removeAttribute("aria-current");
    });
  }
  var t = false;
  addEventListener("scroll", function(){
    if(t) return; t = true;
    requestAnimationFrame(function(){ marcar(); t = false; });
  }, { passive:true });
  marcar();
}

/* ═══ ARRANQUE ═══ */
function arrancar(data, deCache){
  try{
    pintarLocal(data.local || {}, data.actualizado);
    pintarMenu(data);
    document.querySelectorAll(".rev").forEach(observar);
    navActiva();
    if(!deCache) localStorage.setItem(CACHE, JSON.stringify(data));
  }catch(err){
    $("#menu").innerHTML = '<p class="fallo">No se pudo mostrar la carta.</p>';
  }
}

var cache = null;
try{ cache = JSON.parse(localStorage.getItem(CACHE) || "null"); }catch(e){}
if(cache) arrancar(cache, true);

fetch("carta.json", { cache:"no-cache" })
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(d){ arrancar(d, false); })
  .catch(function(){
    if(!cache) $("#menu").innerHTML =
      '<p class="fallo">No se pudo cargar la carta. Revisa la conexión y vuelve a intentarlo.</p>';
  });

})();
</script>
